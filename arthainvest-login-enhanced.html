<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArthaInvest CRM - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; }

        body {
            background: linear-gradient(135deg, #0d5c7e 0%, #1a6b8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #0d5c7e 0%, #1a6b8a 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .login-body {
            padding: 30px;
        }

        .login-form {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #0d5c7e;
            box-shadow: 0 0 0 3px rgba(13, 92, 126, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0d5c7e 0%, #1a6b8a 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 92, 126, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .quick-login {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .quick-login-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            text-align: center;
            margin-bottom: 16px;
        }

        .quick-login-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .quick-btn {
            padding: 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-direction: column;
        }

        .quick-btn:hover {
            background: #f9f9f9;
            border-color: #0d5c7e;
            color: #0d5c7e;
        }

        .quick-btn strong { display: block; }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #0d5c7e;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #0d5c7e;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-box {
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🏢 ArthaInvest CRM</h1>
            <p>Field Caller Tracking System</p>
        </div>

        <div class="login-body">
            <div class="info-box">
                <strong>📌 Important:</strong> This system is for authorized team members only. Use your assigned credentials to login.
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading">
                <span class="spinner"></span> Logging in...
            </div>

            <div class="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                <button class="login-btn" onclick="login()">🔑 Login</button>
            </div>

            <div class="quick-login">
                <div class="quick-login-title">⚡ Quick Login - Demo Accounts</div>
                <div class="quick-login-grid">
                    <button class="quick-btn" onclick="quickLogin('admin', 'admin123', 'Administrator')">
                        <strong>👨‍💼</strong>
                        <span>Admin</span>
                    </button>
                    <button class="quick-btn" onclick="quickLogin('rajesh', 'admin123', 'Rajesh Kumar')">
                        <strong>👨‍💻</strong>
                        <span>Rajesh</span>
                    </button>
                    <button class="quick-btn" onclick="quickLogin('priya', 'admin123', 'Priya Sharma')">
                        <strong>👩‍💼</strong>
                        <span>Priya</span>
                    </button>
                    <button class="quick-btn" onclick="quickLogin('amit', 'admin123', 'Amit Singh')">
                        <strong>👨‍💼</strong>
                        <span>Amit</span>
                    </button>
                    <button class="quick-btn" onclick="quickLogin('sneha', 'admin123', 'Sneha Patel')">
                        <strong>👩‍💻</strong>
                        <span>Sneha</span>
                    </button>
                    <button class="quick-btn" onclick="quickLogin('vikram', 'admin123', 'Vikram Desai')">
                        <strong>👨‍💼</strong>
                        <span>Vikram</span>
                    </button>
                    <button class="quick-btn" onclick="quickLogin('marketing_user', 'admin123', 'Marketing Team')">
                        <strong>📢</strong>
                        <span>Marketing</span>
                    </button>
                    <button class="quick-btn" onclick="quickLogin('team_leader', 'admin123', 'Team Leader')">
                        <strong>👔</strong>
                        <span>Leader</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Demo user database (in real app, this would be server-side)
        const users = {
            'admin': { id: 1, name: 'Artha Admin', email: 'admin@arthainvest.com', role: 'admin', password: 'admin123' },
            'team_leader': { id: 2, name: 'Team Leader', email: 'leader@arthainvest.com', role: 'team_leader', password: 'admin123' },
            'marketing_user': { id: 3, name: 'Marketing User', email: 'marketing@arthainvest.com', role: 'marketing', password: 'admin123' },
            'rajesh': { id: 4, name: 'Rajesh Kumar', email: 'rajesh@email.com', role: 'employee', department: 'Sales', password: 'admin123' },
            'priya': { id: 5, name: 'Priya Sharma', email: 'priya@email.com', role: 'employee', department: 'Insurance', password: 'admin123' },
            'amit': { id: 6, name: 'Amit Singh', email: 'amit@email.com', role: 'employee', department: 'Loans', password: 'admin123' },
            'sneha': { id: 7, name: 'Sneha Patel', email: 'sneha@email.com', role: 'employee', department: 'Funds', password: 'admin123' },
            'vikram': { id: 8, name: 'Vikram Desai', email: 'vikram@email.com', role: 'employee', department: 'Marketing', password: 'admin123' }
        };

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => { errorEl.style.display = 'none'; }, 5000);
        }

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            performLogin(username, password);
        }

        function quickLogin(username, password, displayName) {
            performLogin(username, password);
        }

        function performLogin(username, password) {
            document.getElementById('loading').style.display = 'block';

            // Simulate server delay
            setTimeout(() => {
                const user = users[username];

                if (!user || user.password !== password) {
                    document.getElementById('loading').style.display = 'none';
                    showError('Invalid username or password');
                    return;
                }

                // Create mock JWT token
                const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6' + user.id + ',"username":"' + username + '","role":"' + user.role + '"}';

                // Store in localStorage
                localStorage.setItem('authToken', token);
                localStorage.setItem('user', JSON.stringify({
                    id: user.id,
                    username: username,
                    name: user.name,
                    email: user.email,
                    role: user.role,
                    department: user.department || null
                }));

                // Redirect based on role
                if (user.role === 'admin') {
                    window.location.href = 'admin-dashboard-enhanced.html';
                } else if (user.role === 'team_leader') {
                    window.location.href = 'admin-dashboard-enhanced.html';
                } else if (user.role === 'marketing') {
                    window.location.href = 'employee-app-enhanced.html';
                } else if (user.role === 'employee') {
                    window.location.href = 'employee-app-enhanced.html';
                } else {
                    window.location.href = 'employee-app-enhanced.html';
                }
            }, 1000);
        }

        // Allow Enter key to login
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });
    </script>
</body>
</html>
