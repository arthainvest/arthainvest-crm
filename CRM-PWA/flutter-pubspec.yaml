name: arthainvest_crm_mobile
description: ArthaInvest CRM Pro - Enterprise Fintech Platform for iOS/Android
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.2.8
  path: ^1.8.2

  # Internationalization
  intl: ^0.18.1

  # Networking
  http: ^1.1.0

  # Connectivity
  connectivity_plus: ^4.0.1
  internet_connection_checker: ^1.0.0

  # Local Storage
  shared_preferences: ^2.1.1

  # State Management
  provider: ^6.0.8

  # Date/Time
  flutter_datetime_picker: ^1.5.1

  # UI Components
  flutter_slidable: ^3.0.0
  badges: ^3.0.2
  cached_network_image: ^3.2.3

  # File handling
  file_picker: ^5.3.3
  share_plus: ^7.0.2

  # Push notifications
  firebase_messaging: ^14.4.1

  # Analytics
  firebase_analytics: ^10.2.9

  # Background services
  workmanager: ^0.5.1

  # Platform channels
  flutter_local_notifications: ^15.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
