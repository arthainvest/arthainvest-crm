<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArthaInvest CRM - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; }
        body {
            background: linear-gradient(135deg, #0d5c7e 0%, #1a6b8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #0d5c7e;
            margin-bottom: 4px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: #999;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #0d5c7e;
            box-shadow: 0 0 0 3px rgba(13, 92, 126, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0d5c7e 0%, #1a6b8a 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 92, 126, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .error {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .demo-accounts {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .demo-title {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 12px;
        }

        .demo-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 12px;
            color: #333;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
            text-align: left;
        }

        .demo-button:hover {
            background: #e8e8e8;
            border-color: #0d5c7e;
        }

        .demo-name {
            font-weight: 600;
            color: #0d5c7e;
            margin-bottom: 2px;
        }

        .demo-role {
            font-size: 10px;
            color: #999;
        }

        .role-badge {
            display: inline-block;
            padding: 2px 6px;
            background: #e0f2f1;
            color: #00695c;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🏢</div>
            <div class="logo-text">ArthaInvest CRM</div>
            <div class="logo-subtitle">Enterprise Financial Services Platform</div>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter password" required>
            </div>

            <div class="error" id="error"></div>

            <button type="submit" class="login-button" id="loginBtn">LOGIN</button>
        </form>

        <div class="demo-accounts">
            <div class="demo-title">📌 DEMO ACCOUNTS (Click to Auto-fill)</div>

            <button type="button" class="demo-button" onclick="quickLogin('admin', 'admin123')">
                <div class="demo-name">👨‍💼 Admin
                    <span class="role-badge">ADMIN</span>
                </div>
                <div class="demo-role">Full system access, manage all modules</div>
            </button>

            <button type="button" class="demo-button" onclick="quickLogin('team_leader', 'admin123')">
                <div class="demo-name">👔 Team Leader
                    <span class="role-badge">TEAM LEAD</span>
                </div>
                <div class="demo-role">Assign leads, manage team, update status</div>
            </button>

            <button type="button" class="demo-button" onclick="quickLogin('marketing_user', 'admin123')">
                <div class="demo-name">📱 Marketing
                    <span class="role-badge">MARKETING</span>
                </div>
                <div class="demo-role">Campaigns, email/WhatsApp scheduler</div>
            </button>

            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0;">
                <div class="demo-title">👥 FIELD TEAM MEMBERS (5 Employees)</div>

                <button type="button" class="demo-button" onclick="quickLogin('rajesh', 'admin123')">
                    <div class="demo-name">📞 Rajesh Kumar
                        <span class="role-badge">EMPLOYEE</span>
                    </div>
                    <div class="demo-role">Sales / Loans & Insurance</div>
                </button>

                <button type="button" class="demo-button" onclick="quickLogin('priya', 'admin123')">
                    <div class="demo-name">📞 Priya Sharma
                        <span class="role-badge">EMPLOYEE</span>
                    </div>
                    <div class="demo-role">Insurance Specialist</div>
                </button>

                <button type="button" class="demo-button" onclick="quickLogin('amit', 'admin123')">
                    <div class="demo-name">📞 Amit Singh
                        <span class="role-badge">EMPLOYEE</span>
                    </div>
                    <div class="demo-role">Loans Specialist</div>
                </button>

                <button type="button" class="demo-button" onclick="quickLogin('sneha', 'admin123')">
                    <div class="demo-name">📞 Sneha Patel
                        <span class="role-badge">EMPLOYEE</span>
                    </div>
                    <div class="demo-role">Mutual Funds Specialist</div>
                </button>

                <button type="button" class="demo-button" onclick="quickLogin('vikram', 'admin123')">
                    <div class="demo-name">📢 Vikram Desai
                        <span class="role-badge">EMPLOYEE</span>
                    </div>
                    <div class="demo-role">Marketing & Campaigns</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            await login(username, password);
        }

        async function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            await login(username, password);
        }

        async function login(username, password) {
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('error');
            error.style.display = 'none';
            btn.classList.add('loading');
            btn.textContent = 'Logging in...';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success && data.token) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userData', JSON.stringify(data.user));

                    // Redirect based on role
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (data.user.role === 'team_leader') {
                        window.location.href = 'team-leader-dashboard.html';
                    } else if (data.user.role === 'marketing') {
                        window.location.href = 'marketing-dashboard.html';
                    } else if (data.user.role === 'employee') {
                        window.location.href = 'employee-app.html';
                    }
                } else {
                    error.textContent = data.error || 'Login failed';
                    error.style.display = 'block';
                    btn.classList.remove('loading');
                    btn.textContent = 'LOGIN';
                }
            } catch (err) {
                error.textContent = 'Connection error: ' + err.message;
                error.style.display = 'block';
                btn.classList.remove('loading');
                btn.textContent = 'LOGIN';
            }
        }
    </script>
</body>
</html>
